services:
  migrate:
    build: .
    command: python migrate.py
    restart: "no"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-autowp}:${POSTGRES_PASSWORD:-securepassword}@postgres:5432/${POSTGRES_DB:-autowpdb}
      - SECRET_KEY=${SECRET_KEY:-}
      - FERNET_KEY=${FERNET_KEY:-}
      - AUTOWP_RUNTIME_DIR=/app/runtime
    volumes:
      - autowp_runtime:/app/runtime
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: .
    # command: gunicorn is already specified in Dockerfile
    restart: unless-stopped
    expose:
      - "5003"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-autowp}:${POSTGRES_PASSWORD:-securepassword}@postgres:5432/${POSTGRES_DB:-autowpdb}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-}
      - FERNET_KEY=${FERNET_KEY:-}
      - AUTOWP_RUNTIME_DIR=/app/runtime
    volumes:
      - autowp_runtime:/app/runtime
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.autowp-web.rule=Host(`autowp.web.id`)"
      - "traefik.http.services.autowp-web.loadbalancer.server.port=5003"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # Article jobs (generate/post, regeneration) run up to 45 minutes each, so
    # two workers serve the default queue: this one plus worker-2. Only this
    # one runs RQ's scheduler (delayed jobs). Two jobs of the same site never
    # publish at the same moment (per-site publish lock in tasks/article_jobs.py).
    build: .
    restart: unless-stopped
    command: rq worker --with-scheduler -u redis://redis:6379/0 high default low --max-jobs 100
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-autowp}:${POSTGRES_PASSWORD:-securepassword}@postgres:5432/${POSTGRES_DB:-autowpdb}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-}
      - FERNET_KEY=${FERNET_KEY:-}
      - AUTOWP_RUNTIME_DIR=/app/runtime
    volumes:
      - autowp_runtime:/app/runtime
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-2:
    build: .
    restart: unless-stopped
    command: rq worker -u redis://redis:6379/0 high default low --max-jobs 100
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-autowp}:${POSTGRES_PASSWORD:-securepassword}@postgres:5432/${POSTGRES_DB:-autowpdb}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-}
      - FERNET_KEY=${FERNET_KEY:-}
      - AUTOWP_RUNTIME_DIR=/app/runtime
    volumes:
      - autowp_runtime:/app/runtime
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  research-worker:
    build: .
    restart: unless-stopped
    # Research jobs (manual and the daily scheduled refresh) run on their own
    # queue so a long research run never delays article posting.
    command: rq worker -u redis://redis:6379/0 research
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-autowp}:${POSTGRES_PASSWORD:-securepassword}@postgres:5432/${POSTGRES_DB:-autowpdb}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-}
      - FERNET_KEY=${FERNET_KEY:-}
      - AUTOWP_RUNTIME_DIR=/app/runtime
    volumes:
      - autowp_runtime:/app/runtime
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build: .
    restart: unless-stopped
    command: python dispatcher.py
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-autowp}:${POSTGRES_PASSWORD:-securepassword}@postgres:5432/${POSTGRES_DB:-autowpdb}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-}
      - FERNET_KEY=${FERNET_KEY:-}
      - AUTOWP_RUNTIME_DIR=/app/runtime
    volumes:
      - autowp_runtime:/app/runtime
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-autowp}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-securepassword}
      - POSTGRES_DB=${POSTGRES_DB:-autowpdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  autowp_runtime:
  redis_data:
